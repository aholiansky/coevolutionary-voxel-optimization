[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcstego"
version = "0.1.0"
description = "Research core for Minecraft steganography experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
minecraft = ["amulet-core"]
legacy = [
  "cryptography",
  "flask",
  "matplotlib",
  "numpy",
  "psutil",
  "reedsolo",
  "requests",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
